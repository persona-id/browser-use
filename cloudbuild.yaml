# cloudbuild.yaml
# Build with BuildKit, push to Artifact Registry, deploy to Cloud Run.

substitutions:
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: persona-web-development
  _SERVICE_NAME: browser-use
  _DEPLOY_REGION: us-central1
  _IMAGE: ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}

# Use Cloud Logging so triggers with a custom build SA don't require a GCS logs bucket.
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build with BuildKit enabled (required for RUN --mount=type=cache,...)
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      # Pass TARGET* args so bash -o nounset in the Dockerfile won't fail
      - --build-arg
      - TARGETPLATFORM=linux/amd64
      - --build-arg
      - TARGETARCH=amd64
      - --build-arg
      - TARGETVARIANT=
      - --build-arg
      - TARGETOS=linux
      - -t
      - ${_IMAGE}
      - .
      - -f
      - Dockerfile

  # 2) Push the image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  # 3) Deploy to Cloud Run (tune flags as needed)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --image=${_IMAGE}
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID},gcb-trigger-id=${TRIGGER_NAME}
      - --region=${_DEPLOY_REGION}
      # - --quiet
      # Resource configuration for browser dependencies
      # - --cpu=2
      # - --memory=4Gi
      # - --timeout=900
      # - --concurrency=1
      # - --max-instances=10
      # - --stimeout=240
      # - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest
      # - --set-env-vars=BROWSER_USE_LOGGING_LEVEL=debug
      # - --vpc-connector=projects/$PROJECT_ID/locations/${_REGION}/connectors/<connector>

images:
  - ${_IMAGE}